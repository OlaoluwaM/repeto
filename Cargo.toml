[workspace]
members = ["crates/repeto-assessment"]
resolver = "3"

[package]
name = "repeto"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Deterministic study review state engine"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "repeto"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
fsrs-rs = { package = "fsrs", version = "=6.6.2" }
jsonschema = "0.30.0"
regress = "=0.11.1"
repeto-assessment = { path = "crates/repeto-assessment" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }

[build-dependencies]
serde_json = "1.0.140"
typify = "0.6.2"

[dev-dependencies]
tempfile = "3.19.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
